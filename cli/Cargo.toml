[package]
name = "wwa-cli"
version = "0.1.0"
edition = "2024"
license = "MIT"

[[bin]]
name = "wwa"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
json5 = "1.3.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"
wwa = { path = "../lib", version = "0.1.0", features = ["serde"] }
