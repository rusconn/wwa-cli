[package]
name = "wwa-cli"
version = "0.1.0"
edition = "2024"
license = "MIT"

[[bin]]
name = "wwa"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
itertools = "0.14.0"
json5 = "1.3.1"
thiserror = "2.0.18"
wwa = { path = "../lib", version = "0.1.0", features = ["serde"] }
