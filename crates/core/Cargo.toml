[package]
name = "wwa"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = ["analyze", "breakpoint"]
analyze = []
breakpoint = ["dep:rustc-hash"]
serde = ["dep:serde"]

[dependencies]
rustc-hash = { version = "2.1.2", optional = true }
serde = { workspace = true, optional = true }

[dev-dependencies]
criterion = "0.8.2"

[[bench]]
name = "breakpoint"
harness = false
required-features = ["breakpoint"]

[lints]
workspace = true
