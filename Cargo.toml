[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.88"
license = "MIT"

[workspace.dependencies]
serde = { version = "1.0.228", features = ["derive"] }

[workspace.lints.clippy]
pedantic = { priority = -1, level = "warn" }
missing_errors_doc = "allow"

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
